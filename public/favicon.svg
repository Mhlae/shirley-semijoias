<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Roxo da Shirley Semijoias -->
    <linearGradient id="shirleyPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B51E0" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#4A128B" />
    </linearGradient>

    <!-- Gradiente para o Diamante/Cristais -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0AAFF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
  </defs>

  <!-- Moldura Ornamental Circular Externa (Estilo Renda/Mandala de Joias) -->
  <g fill="none" stroke="url(#shirleyPurpleGrad)" stroke-width="1.2">
    <!-- Círculo Base -->
    <circle cx="50" cy="50" r="43" stroke-width="1" />
    
    <!-- Detalhes Rendados nas Bordas (Petalas / Arabescos) -->
    <path d="M 50 5 C 47 11, 53 11, 50 5 Z
             M 65 9 C 61 14, 67 16, 65 9 Z
             M 78 17 C 72 21, 77 25, 78 17 Z
             M 88 29 C 81 31, 84 37, 88 29 Z
             M 93 44 C 86 44, 87 51, 93 44 Z
             M 92 60 C 85 58, 84 65, 92 60 Z
             M 85 74 C 79 70, 76 77, 85 74 Z
             M 73 85 C 68 80, 63 86, 73 85 Z
             M 58 92 C 55 86, 49 90, 58 92 Z
             M 42 92 C 45 86, 51 90, 42 92 Z
             M 27 85 C 32 80, 37 86, 27 85 Z
             M 15 74 C 21 70, 24 77, 15 74 Z
             M 8 60 C 15 58, 16 65, 8 60 Z
             M 7 44 C 14 44, 13 51, 7 44 Z
             M 12 29 C 19 31, 16 37, 12 29 Z
             M 22 17 C 28 21, 23 25, 22 17 Z
             M 35 9 C 39 14, 33 16, 35 9 Z" fill="url(#shirleyPurpleGrad)" opacity="0.8" />

    <!-- Pérolas Decorativas na Moldura -->
    <g fill="#FFFFFF" stroke="#7B2CBF" stroke-width="0.6">
      <circle cx="50" cy="7" r="1.5" />
      <circle cx="80" cy="20" r="1.5" />
      <circle cx="91" cy="50" r="1.5" />
      <circle cx="80" cy="80" r="1.5" />
      <circle cx="50" cy="93" r="1.5" />
      <circle cx="20" cy="80" r="1.5" />
      <circle cx="9" cy="50" r="1.5" />
      <circle cx="20" cy="20" r="1.5" />
    </g>
  </g>

  <!-- Letra 'S' Elegante da Shirley Semijoias -->
  <path d="M 61 28 
           C 40 22, 30 36, 48 46 
           C 68 56, 56 78, 36 71 
           C 31 69, 28 65, 28 65" fill="none" stroke="url(#shirleyPurpleGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Detalhes de Corrente Pendurada no 'S' -->
  <path d="M 33 32 Q 22 45 32 60 M 64 42 Q 74 55 62 68" fill="none" stroke="url(#shirleyPurpleGrad)" stroke-width="1.2" stroke-dasharray="2,2" />

  <!-- Coroa de Diamantes / Cristais Lapidados Central -->
  <g transform="translate(50,47) scale(0.85)">
    <!-- Cristal Central -->
    <polygon points="0,-12 6,-2 0,10 -6,-2" fill="url(#gemGrad)" stroke="#FFFFFF" stroke-width="0.8" />
    <!-- Cristais Laterais -->
    <polygon points="-5,-10 0,-2 -6,7 -9,-1" fill="url(#shirleyPurpleGrad)" stroke="#FFFFFF" stroke-width="0.6" />
    <polygon points="5,-10 0,-2 6,7 9,-1" fill="url(#shirleyPurpleGrad)" stroke="#FFFFFF" stroke-width="0.6" />
    <!-- Brilho do Diamante -->
    <circle cx="0" cy="-2" r="1" fill="#FFFFFF" />
  </g>
</svg>